; Lucent — English
;
; The app rewrites this file every time it starts. To add a language, copy this file,
; name the copy after the language code (e.g. es.ini, pt-br.ini) and translate the text
; after each "=". Lines you leave out stay in English. Keep {name} placeholders as they
; are: the app fills them in. \n starts a new line.

