[effect]
wave.name = Wave
wave.description = A smooth, continuous wave of color sweeping across the keyboard.
wave_2.name = Wave 2
wave_2.description = A faster wave that flashes like a beacon, with a pause in the middle.
spiral.name = Spiral
spiral.description = The light turns softly around the center of the keyboard.
acid.name = Acid
acid.description = The whole keyboard fades softly from one color to the next.
breathing.name = Breathing
breathing.description = The light slowly fades in and out, like breathing.
static.name = Static
static.description = One steady color on every key.
ripple.name = Ripple
ripple.description = Every key you press sends out a spreading wave.
reactive.name = Key on touch
reactive.description = The key you press lights up, then slowly fades.
reactive_row.name = Row on touch
reactive_row.description = The row of the key you press lights up, then fades.
matrix_3.name = Matrix
matrix_3.description = Falling drops of light, like in the movie.
matrix_2.name = Matrix 2
matrix_2.description = Like Matrix, but the keys between drops stay lit.
rainbow.name = Rainbow
rainbow.description = The light flows vertically, row after row, with gradients.
heartbeat.name = Heartbeat
heartbeat.description = A sine curve drawn across the keys, like an electrocardiogram.
kamehameha.name = Kamehameha
kamehameha.description = Light gathers from the edges into a ball in the center, then bursts outward.
digital_times.name = Digital Times
digital_times.description = Similar to Matrix: trails of light flowing down.
ping_pong.name = Ping Pong
ping_pong.description = A diagonal band moves left to right in a loop. The more you type, the faster it goes.
surmount.name = Surmount
surmount.description = Like Acid, but the color only changes while you type: at rest it holds still.
glorious.name = Glorious
glorious.description = The light starts in the center and spreads to both sides, as if pulsing.

