; Lucent — Italiano
;
; Questo file viene riscritto dall'app a ogni avvio. Per una nuova lingua copia en.ini,
; rinominalo con il codice della lingua (es. es.ini, pt-br.ini) e traduci il testo dopo
; ogni "=". Le righe che mancano restano in inglese. {nome} tra graffe va lasciato così:
; l'app lo sostituisce con un valore. \n va a capo.

