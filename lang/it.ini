[effect]
wave.name = Onda
wave.description = Un'onda di colore continua e sfumata che attraversa la tastiera.
wave_2.name = Onda 2
wave_2.description = Un'onda più rapida, a lampi come un lampeggiante, con una pausa nel mezzo.
spiral.name = Spirale
spiral.description = La luce ruota morbida attorno al centro della tastiera.
acid.name = Acido
acid.description = Tutta la tastiera passa da un colore all'altro, in modo soffuso.
breathing.name = Respiro
breathing.description = La luce si accende e si spegne lentamente, come un respiro.
static.name = Fisso
static.description = Un colore fisso su tutti i tasti.
ripple.name = Increspatura
ripple.description = Da ogni tasto premuto parte un'onda che si allarga.
reactive.name = Tasto al tocco
reactive.description = Si accende il tasto premuto, poi si spegne piano.
reactive_row.name = Riga al tocco
reactive_row.description = Dal tasto premuto si accende la sua riga, poi si spegne.
matrix_3.name = Matrix
matrix_3.description = Gocce di luce che cadono, come nel film.
matrix_2.name = Matrix 2
matrix_2.description = Come Matrix, ma i tasti tra una goccia e l'altra restano accesi.
rainbow.name = Arcobaleno
rainbow.description = La luce scorre in verticale, riga dopo riga, con sfumature.
heartbeat.name = Battito
heartbeat.description = Una curva sinusoidale disegnata dai tasti, come un elettrocardiogramma.
kamehameha.name = Kamehameha
kamehameha.description = La luce arriva dai bordi, forma una sfera al centro e poi esplode verso l'esterno.
digital_times.name = Digital Times
digital_times.description = Simile a Matrix: scie di luce che scendono.
ping_pong.name = Ping Pong
ping_pong.description = Una banda diagonale va da sinistra a destra in loop. Più scrivi, più accelera.
surmount.name = Surmount
surmount.description = Come Acido, ma il colore cambia solo mentre scrivi: da fermo resta fisso.
glorious.name = Glorious
glorious.description = La luce nasce al centro e si allarga verso i due lati, come se pulsasse.

