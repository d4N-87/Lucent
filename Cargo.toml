[workspace]
resolver = "3"
members = ["crates/lucent-core", "crates/lucent-dev", "src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2024"

[workspace.dependencies]
lucent-core = { path = "crates/lucent-core" }
hidapi = "2.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
